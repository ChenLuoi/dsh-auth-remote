name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Check version and master ancestry
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

  package:
    name: Build the release artifact once
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      archive: ${{ steps.identity.outputs.archive }}
      sha256: ${{ steps.identity.outputs.sha256 }}
      versions: ${{ steps.identity.outputs.versions }}
      browser-matrix: ${{ steps.identity.outputs.browser-matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
      - run: node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"
      - run: pnpm check:static
      - run: pnpm test:unit
      - run: pnpm exec tsx --test tests/integration/*.test.ts
      - run: node scripts/pack.mjs
      - name: Record archive identity and full matrices
        id: identity
        run: node scripts/packed-artifact.mjs record
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
          if-no-files-found: error

  verify:
    name: Verify every declared release
    needs: package
    uses: ./.github/workflows/verify-packed.yml
    with:
      artifact: release-package
      archive: ${{ needs.package.outputs.archive }}
      sha256: ${{ needs.package.outputs.sha256 }}
      plan: full
      versions: ${{ needs.package.outputs.versions }}
      browser-matrix: ${{ needs.package.outputs.browser-matrix }}

  publish:
    name: Publish npm and GitHub Release
    needs: [tag, package, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-package
          path: artifacts
      - name: Verify archive and check npm version
        id: npm-version
        env:
          DSH_ARCHIVE_NAME: ${{ needs.package.outputs.archive }}
          DSH_ARCHIVE_SHA: ${{ needs.package.outputs.sha256 }}
        run: |
          node scripts/packed-artifact.mjs check "artifacts/$DSH_ARCHIVE_NAME" "$DSH_ARCHIVE_SHA"
          archive="artifacts/$DSH_ARCHIVE_NAME"
          status="$(node scripts/check-npm-publication.mjs "$archive")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Publish to npm with trusted publishing
        if: steps.npm-version.outputs.status == 'unpublished'
        run: npm publish "./artifacts/dsh-auth-remote-${GITHUB_REF_NAME#v}.tgz" --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/SHA256SUMS --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/SHA256SUMS \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
