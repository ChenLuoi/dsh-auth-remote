packages:
  - .

# Host services come from the running DSH, never an automatically installed peer copy.
autoInstallPeers: false

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-host-webserver@0.2.0-rc.1'
  - '@deepseek-ai/dsh-brand@0.2.0-rc.1'
  - '@deepseek-ai/dsh-client-connection@0.2.0-rc.1'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.0-rc.1'
  - '@deepseek-ai/dsh-credentials@0.2.0-rc.1'
  - '@deepseek-ai/dsh-invariants@0.2.0-rc.1'
  - '@deepseek-ai/dsh-scope@0.2.0-rc.1'
  - prettier@3.9.9
  - '@deepseek-ai/dsh-client-ui-slots@0.2.0-rc.1'
  - '@deepseek-ai/dsh-client-locale@0.2.0-rc.1'
